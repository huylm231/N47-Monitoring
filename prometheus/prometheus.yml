# =============================================================================
# N4.7 – Hệ thống giám sát máy chủ, Cloud và trung tâm dữ liệu
# Tệp     : prometheus/prometheus.yml
# Phụ trách: TV3 (Backend Monitoring)
# Mount   : ./prometheus/prometheus.yml -> /etc/prometheus/prometheus.yml (ro)
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# -----------------------------------------------------------------------------
# Luật cảnh báo (TV5)
# Đường dẫn tương đối so với vị trí tệp này trong container:
#   rules/*.yml  ->  /etc/prometheus/rules/*.yml
# docker-compose.yml mount thư mục rules vào container bằng dòng:
#   - ./prometheus/rules:/etc/prometheus/rules:ro
# Nếu thiếu dòng này, Prometheus không nạp rule nào và không báo lỗi.
# -----------------------------------------------------------------------------
rule_files:
  - "rules/*.yml"

# -----------------------------------------------------------------------------
# Alertmanager (TV5) – đang để comment, bật khi compose có service alertmanager
# -----------------------------------------------------------------------------
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  # ---- Job bắt buộc 1: Prometheus tự giám sát ----
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # ---- Job bắt buộc 2: Metric hệ điều hành Linux ----
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # ---------------------------------------------------------------------------
  # JOB PHỤ TRỢ (tùy chọn) – bỏ comment khi TV2 thêm service vào compose.
  # Tên host phải TRÙNG với tên service trong docker-compose.yml.
  # ---------------------------------------------------------------------------

  # ---- cAdvisor: metric container ----
  - job_name: "cadvisor"
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]

