groups:
  - name: n47_alert_rules
    rules:
      - alert: HostHighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage is high on {{ $labels.instance }}"
          description: "CPU usage has exceeded 80% (current value: {{ $value }}%)"

      - alert: HostCPUHighCritical
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels: 
          severity: critical
        annotations:
          summary: "Host CPU high critical (instance {{ $labels.instance }})"
          description: "CPU usage is above 90% for more than 5 minutes."

      - alert: HostMemoryHighWarning
        expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 70
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host high memory usage (instance {{$labels.instance }})"
          description: "RAM usage is above 85% (current value is {{ $value }}%)"

      - alert: HostOutOfDiskSpace
        expr: (node_filesystem_avail_bytes{device="/dev/sda3"} / node_filesystem_size_bytes{device="/dev/sda3"}) * 100 < 15
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Disk space is running low on {{ $labels.instance }}"
          description: "Root partition free space is below 15% (current value: {{ $value }}%)"

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is down"
          description: "Target node-exporter has been unreachable for me more than 1 minute."  

      - alert: HostMemoryHighCritical
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 72
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host memory high critical (instance {{ $labels.instance }})"
          description: "RAM used > 95% liên tục trong 5 phút. Nguy cơ OOM cao, cần giải phóng hoặc giới hạn workload."

      - alert: HostDiskLowCritical
        expr: node_filesystem_free_bytes{device="dev/sda3"} / node_filesystem_size_bytes{device="/dev/sda3"} * 100 < 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host disk low critical (instance {{ $labels.instance }})"
          description: "Dung lượng đĩa trống < 10% liên tục 2 phút. Cần dừng tác vụ ghi thử nghiệm và giải phóng dữ liệu."

      - alert: EndpointDown
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint down (instance {{ $labels.instance }})"
          description: "Service/Endpoint không phản hồi (probe_success = 0) liên tục trong 1 phút."

      - alert: ContainerMemoryHigh
        expr: container_memory_working_set_bytes{container!=""} / container_spec_memory_limit_bytes{container!=""} * 100 > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Container memory high (container {{ $labels.container }})"
          description: "Working set / memory limit của container > 90% liên tục trong 5 phút."   
